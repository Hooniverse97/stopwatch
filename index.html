<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070a14" />
<title>바울의 선교여행 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070a14; --parchment:#f1e4bd; --parchment-dim:#c2b089;
    --gold:#d9ad4e; --gold-bright:#ffd56e; --gold-deep:#8a6a24;
    --silver:#d6dbe3; --silver-dim:#98a0ae; --red:#ff5a47; --green:#7adc90;
    --glass:rgba(255,255,255,.055); --glass-edge:rgba(255,255,255,.12);
    --land:#2b2a22; --land-edge:#7a6738;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--ink)}
  body{
    min-height:100vh; font-family:'Noto Serif KR',serif; color:var(--parchment); user-select:none;
    background:
      radial-gradient(900px 500px at 50% -10%, #1d2a52 0%, transparent 70%),
      radial-gradient(600px 400px at 100% 100%, #2a1d10 0%, transparent 70%),
      var(--ink);
    display:flex; justify-content:center;
  }
  /* 필름 그레인: 실버 질감 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

  .app{width:min(100%,520px);display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px 0}
  .head{display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:'Cinzel',serif;font-size:12px;letter-spacing:4px;color:var(--gold)}
  .brand small{display:block;font-family:'Noto Serif KR',serif;letter-spacing:6px;font-size:10px;color:var(--parchment-dim);margin-top:2px}
  .pace{display:flex;gap:6px}
  .chip{font:600 11px var(--mono);color:var(--silver-dim);background:var(--glass);border:1px solid var(--glass-edge);
    padding:7px 10px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
  @media (max-width:420px){.brand{font-size:10px;letter-spacing:2px}.chip{padding:7px 8px;font-size:10px}.pace{gap:4px}}
  .chip[aria-pressed=true]{color:#1a1200;background:linear-gradient(145deg,var(--gold-bright),var(--gold));border-color:transparent}
  .chip:disabled{opacity:.35;cursor:not-allowed}
  .chip:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

  /* 시간 히어로 (블루) */
  .hero{padding:6px 4px 0;text-align:center}
  .time{font-family:var(--mono);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px;
    font-size:clamp(56px,17.5vw,92px);display:inline-flex;align-items:baseline;
    background:linear-gradient(180deg,#fff7de 0%,var(--parchment) 45%,#b8a56e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(255,213,110,.14))}
  .time .sep{opacity:.55;margin:0 1px}
  .time .ms{font-size:.42em;font-weight:600;letter-spacing:0;margin-left:4px;
    background:none;color:var(--gold);-webkit-text-fill-color:var(--gold);opacity:.9}
  .time.paused{animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.45}}
  .where{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:6px}
  .city-name{font-size:20px;font-weight:700;color:var(--gold-bright);letter-spacing:2px}
  .city-name.flash{animation:flash .9s cubic-bezier(.2,1.4,.4,1)}
  @keyframes flash{0%{transform:scale(1.35);filter:drop-shadow(0 0 14px #ffd56e)}100%{transform:none}}
  .city-en{font:500 11px 'Cinzel',serif;letter-spacing:3px;color:var(--parchment-dim)}
  .note{font-size:12px;color:var(--parchment-dim);margin-top:4px;min-height:36px;line-height:1.55;padding:0 8px}

  /* 지도 카드 (실버: 글래스 + 금속 베젤) */
  .map-card{position:relative;border-radius:20px;overflow:hidden;background:#0c1a33;
    border:1px solid transparent;
    background-image:linear-gradient(#0c1a33,#0c1a33),conic-gradient(from 210deg,#6c7280,#e9edf3,#7c8391,#2c3140,#9aa2b0,#e9edf3,#6c7280);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6)}
  .map-card svg{display:block;width:100%;height:auto}
  .map-card svg *{vector-effect:non-scaling-stroke}
  .ph{opacity:0;visibility:hidden;transition:opacity .9s,visibility 0s .9s}
  .ph.on{opacity:1;visibility:visible;transition:opacity .9s .25s,visibility 0s}
  .grid{stroke:rgba(241,228,189,.06);stroke-width:.5}
  .land{fill:var(--land);stroke:var(--land-edge);stroke-width:.8;stroke-linejoin:round}
  .route-dim{stroke:rgba(241,228,189,.28);stroke-width:1.1;stroke-dasharray:3 3;fill:none}
  .route-done{stroke:var(--gold-bright);stroke-width:2.2;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 3px rgba(255,213,110,.8))}
  .city-dot{fill:#3a3524;stroke:var(--parchment-dim);stroke-width:1;transition:fill .3s}
  .city-dot.visited{fill:var(--gold);stroke:var(--gold-bright)}
  .city-dot.current{fill:var(--gold-bright);stroke:#fff}
  .city-label{font-size:9px;fill:var(--parchment-dim);paint-order:stroke;stroke:rgba(7,10,20,.85);stroke-width:2.5px}
  .city-label.visited{fill:var(--parchment)} .city-label.current{fill:var(--gold-bright);font-weight:700}
  .pulse{fill:none;stroke:var(--gold-bright);stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center}
  .pulse.go{animation:pulse 1.3s ease-out}
  @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
  .paul{filter:drop-shadow(0 0 6px rgba(255,213,110,.9))}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 2s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.5);opacity:.5}}
  .badge{position:absolute;right:12px;top:10px;font:500 10px 'Cinzel',serif;letter-spacing:3px;color:var(--gold);
    background:rgba(7,10,20,.65);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;border:1px solid var(--glass-edge)}
  .toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,30px);opacity:0;pointer-events:none;
    font-weight:700;font-size:14px;color:#1a1200;padding:8px 18px;border-radius:99px;white-space:nowrap;
    background:linear-gradient(145deg,var(--gold-bright),var(--gold));box-shadow:0 8px 24px rgba(255,213,110,.35)}
  .toast.show{animation:toast 2.2s cubic-bezier(.2,1.2,.4,1)}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,30px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}

  /* 골드: 메달 + 진행 */
  .quest{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .medal{background:var(--glass);border:1px solid var(--glass-edge);border-radius:14px;padding:10px 6px 8px;text-align:center;
    backdrop-filter:blur(8px);transition:.4s}
  .medal b{display:block;font:700 15px 'Cinzel',serif;color:var(--silver-dim)}
  .medal span{display:block;font-size:10px;color:var(--silver-dim);margin-top:2px}
  .medal i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
  .medal i::after{content:'';display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));transition:width .3s}
  .medal.done{border-color:rgba(255,213,110,.55);background:linear-gradient(160deg,rgba(255,213,110,.18),rgba(255,213,110,.04))}
  .medal.done b{color:var(--gold-bright);text-shadow:0 0 12px rgba(255,213,110,.6)} .medal.done span{color:var(--parchment)}
  .medal.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:none}}

  /* 랩 (블루) */
  .laps-wrap{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;overflow:hidden;backdrop-filter:blur(8px)}
  .laps-head,.lap{display:grid;grid-template-columns:34px 1fr 92px 92px;gap:8px;padding:10px 14px;align-items:center}
  .laps-head{font:500 10px 'Cinzel',serif;letter-spacing:2px;color:var(--gold);background:rgba(0,0,0,.28)}
  .laps-head div:nth-child(n+3),.lap .s,.lap .t{text-align:right}
  .laps{max-height:190px;overflow-y:auto}
  .laps::-webkit-scrollbar{width:4px}.laps::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:2px}
  .lap{font:600 13px var(--mono);font-variant-numeric:tabular-nums;border-top:1px solid rgba(255,255,255,.05);animation:lapIn .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes lapIn{from{opacity:0;transform:translateY(-10px);background:rgba(255,213,110,.18)}to{opacity:1;transform:none}}
  .lap .no{color:var(--gold);font-family:'Cinzel',serif} .lap .c{font:700 13px 'Noto Serif KR',serif;color:var(--gold-bright)}
  .lap .t{color:var(--silver-dim);font-weight:400}
  .lap.fastest .s{color:var(--green)} .lap.slowest .s{color:var(--red)}
  .laps-empty{padding:18px;text-align:center;font-size:12px;color:var(--parchment-dim);font-style:italic}
  .stats{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--silver-dim);padding:0 6px}
  .stats b{color:var(--parchment)}

  /* 하단 고정 조작부: 엄지 영역 (블랙) */
  .dock{position:sticky;bottom:0;margin:6px -14px 0;padding:14px 18px max(16px,env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:12px;align-items:center;
    background:linear-gradient(180deg,rgba(7,10,20,0),rgba(7,10,20,.92) 38%);backdrop-filter:blur(10px)}
  .btn{position:relative;overflow:hidden;height:72px;border:none;border-radius:22px;cursor:pointer;color:var(--parchment);
    font:700 13px 'Cinzel',serif;letter-spacing:3px;
    background:linear-gradient(160deg,#343b52,#171c2e);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 6px rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5),0 0 0 1px rgba(214,219,227,.22);
    transition:transform .12s cubic-bezier(.3,1.6,.6,1),box-shadow .15s}
  .btn:active:not(:disabled){transform:scale(.94)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.start{height:84px;font-size:16px;color:#1a1200;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(80,50,0,.5),0 10px 26px rgba(217,173,78,.38),0 0 0 1px rgba(255,220,120,.55)}
  .btn.start.running{color:#fff;background:linear-gradient(160deg,#ff7a68,var(--red) 55%,#8a2010);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -4px 8px rgba(60,0,0,.5),0 10px 26px rgba(255,90,71,.4),0 0 0 1px rgba(255,130,110,.55)}
  .btn.start::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
    transform:translateX(-120%);animation:sheen 4s ease-in-out infinite}
  @keyframes sheen{60%,100%{transform:translateX(120%)}}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .keys{text-align:center;font-size:11px;color:var(--silver-dim);padding-bottom:6px}
  kbd{font:500 10px var(--mono);border:1px solid rgba(214,219,227,.3);border-radius:4px;padding:0 5px;margin:0 2px}

  .confetti{position:fixed;top:-10px;width:8px;height:12px;pointer-events:none;z-index:9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand">THE MISSIONARY JOURNEYS<small>바 울 의 발 걸 음</small></div>
    <div class="pace" role="group" aria-label="이동 속도">
      <button class="chip" data-step="10" aria-pressed="true">10초</button>
      <button class="chip" data-step="30" aria-pressed="false">30초</button>
      <button class="chip" data-step="60" aria-pressed="false">1분</button>
      <button class="chip" data-step="300" aria-pressed="false">5분</button>
    </div>
  </div>

  <div class="hero">
    <div class="time" id="time"><span id="hh"></span><span id="mm">00</span><span class="sep">:</span><span id="ss">00</span><span class="ms" id="cs">.00</span></div>
    <div class="where"><span class="city-name" id="cityName" aria-live="polite">안디옥</span><span class="city-en" id="cityEn">ANTIOCH</span></div>
    <div class="note" id="note">START를 눌러 여정을 시작하세요</div>
  </div>

  <div class="map-card">
    <svg id="map" viewBox="0 0 400 230" role="img" aria-label="바울의 선교여행 지도">
      <defs><radialGradient id="seaGrad" cx="50%" cy="40%" r="75%"><stop offset="0%" stop-color="#18325e"/><stop offset="100%" stop-color="#091226"/></radialGradient></defs>
      <rect width="400" height="230" fill="url(#seaGrad)"/>
      <g id="grid"></g>
      <g id="world">
        <g id="lands"></g><g id="phases"></g>
        <circle class="pulse" id="pulse" r="4"/>
        <g class="paul" id="paul">
          <circle class="halo" r="7" fill="rgba(255,213,110,.22)"/>
          <circle r="4.2" fill="#ffd56e" stroke="#fff" stroke-width="1"/>
          <path d="M0,-2.3 V2.3 M-1.7,-.6 H1.7" stroke="#2a1d05" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <div class="badge" id="badge">1ST JOURNEY</div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="quest" id="quest" aria-label="여정 메달"></div>

  <div class="laps-wrap">
    <div class="laps-head"><div>#</div><div>도시</div><div>구간</div><div>총시간</div></div>
    <div class="laps" id="laps"><div class="laps-empty" id="lapsEmpty">LAP을 누르면 지금 있는 도시와 구간 기록이 남습니다</div></div>
  </div>
  <div class="stats"><span>완주 <b id="stComp">0</b>회</span><span>누적 <b id="stTotal">00:00</b></span><span>방문 <b id="stCity">1</b>/<span id="stN">24</span></span></div>
  <div class="keys"><kbd>Space</kbd> 시작/정지 <kbd>L</kbd> 랩 <kbd>R</kbd> 초기화</div>

  <div class="dock">
    <button class="btn" id="resetBtn" disabled aria-label="초기화">RESET</button>
    <button class="btn start" id="startBtn">START</button>
    <button class="btn" id="lapBtn" disabled aria-label="랩">LAP</button>
  </div>
</div>

<script>
  const TRAVEL = 0.7;
  let STEP_MS = 10000;

  const PHASES = [
    {t:'1ST JOURNEY',name:'제1차 선교여행',view:{lon:33.2,lat:36.4,span:10.5}},
    {t:'2ND JOURNEY',name:'제2차 선교여행',view:{lon:28.9,lat:38.9,span:18}},
    {t:'3RD JOURNEY',name:'제3차 선교여행',view:{lon:29.5,lat:35.8,span:21}},
    {t:'ROME VOYAGE',name:'로마 압송 항해',view:{lon:24,lat:37,span:26}},
  ];
  const c=(ph,ko,en,lon,lat,note,dx,dy,a)=>({ph,ko,en,lon,lat,note,dx,dy,a});
  const ANT=(ph,note)=>c(ph,'안디옥','Antioch',36.2,36.2,note,-6,-5,'end');
  const CITIES = [
    ANT(1,'성령이 바울과 바나바를 세움 · 행 13:2'),
    c(1,'구브로','Cyprus',33.0,34.9,'총독이 믿고 사울이 바울로 불림 · 행 13:7-12',0,11,'middle'),
    c(1,'버가','Perga',30.85,36.96,'마가 요한이 일행을 떠남 · 행 13:13',-5,11,'end'),
    c(1,'비시디아 안디옥','Pisidian Antioch',31.19,38.31,'회당에서 첫 설교, 이방인에게로 · 행 13:14-46',0,-7,'middle'),
    c(1,'이고니온','Iconium',32.49,37.87,'회당에서 담대히 복음을 전함 · 행 14:1-3',7,-2,'start'),
    c(1,'루스드라','Lystra',32.45,37.58,'걷지 못하던 자가 일어남 · 행 14:8-10',-6,8,'end'),
    c(1,'더베','Derbe',33.35,37.35,'많은 사람을 제자로 삼음 · 행 14:20-21',7,6,'start'),

    ANT(2,'실라와 함께 교회들을 굳게 함 · 행 15:40-41'),
    c(2,'드로아','Troas',26.1,39.75,'마게도냐 사람의 환상 · 행 16:9',-5,-4,'end'),
    c(2,'빌립보','Philippi',24.3,41.0,'루디아와 간수의 가정이 믿음 · 행 16:14-34',0,-7,'middle'),
    c(2,'데살로니가','Thessalonica',22.94,40.64,'세 안식일 동안 성경을 풀어 증거함 · 행 17:2',8,8,'start'),
    c(2,'베뢰아','Berea',22.2,40.52,'날마다 성경을 상고한 사람들 · 행 17:11',-6,4,'end'),
    c(2,'아덴','Athens',23.73,37.98,'아레오바고에서 알지 못하는 신을 전함 · 행 17:22-23',6,3,'start'),
    c(2,'고린도','Corinth',22.9,37.9,'일 년 육 개월을 머물며 가르침 · 행 18:11',-6,9,'end'),

    ANT(3,'여러 지방 제자들을 굳건하게 함 · 행 18:23'),
    c(3,'에베소','Ephesus',27.34,37.94,'두란노 서원에서 두 해 동안 강론 · 행 19:9-10',6,-6,'start'),
    c(3,'고린도','Corinth',22.9,37.9,'헬라에서 석 달을 머묾 · 행 20:2-3',-6,9,'end'),
    c(3,'드로아','Troas',26.1,39.75,'유두고를 다시 살림 · 행 20:7-12',-5,-4,'end'),
    c(3,'밀레도','Miletus',27.28,37.53,'에베소 장로들과 눈물의 작별 · 행 20:17-38',6,11,'start'),
    c(3,'두로','Tyre',35.2,33.3,'제자들과 바닷가에서 무릎 꿇고 기도 · 행 21:3-6',5,1,'start'),
    c(3,'가이사랴','Caesarea',34.9,32.5,'전도자 빌립의 집에 머묾 · 행 21:8',-6,2,'end'),
    c(3,'예루살렘','Jerusalem',35.2,31.8,'성전에서 붙잡혀 체포됨 · 행 21:27-33',-6,9,'end'),

    c(4,'가이사랴','Caesarea',34.9,32.5,'죄수의 몸으로 로마를 향해 출항 · 행 27:1-2',-6,2,'end'),
    c(4,'무라','Myra',30.0,36.26,'이탈리아로 가는 알렉산드리아 배로 갈아탐 · 행 27:5-6',-4,-6,'middle'),
    c(4,'미항','Fair Havens',24.8,35.1,'항해가 위험하다 경고했으나 출항 · 행 27:9-12',0,11,'middle'),
    c(4,'멜리데','Malta',14.4,35.9,'난파 후 독사를 떨쳐 버림 · 행 28:1-6',0,10,'middle'),
    c(4,'수라구사','Syracuse',15.3,37.1,'사흘을 머묾 · 행 28:12',7,3,'start'),
    c(4,'보디올','Puteoli',14.1,40.8,'형제들을 만나 이레를 머묾 · 행 28:13-14',-5,3,'end'),
    c(4,'로마','Rome',12.5,41.9,'이 년 동안 담대히 하나님 나라를 전함 · 행 28:30-31',-5,-4,'end'),
  ];
  const N = CITIES.length;
  const phaseRange = p => { const idx=CITIES.map((x,i)=>x.ph===p?i:-1).filter(i=>i>=0); return {from:idx[0],to:idx[idx.length-1]}; };
  const MEDALS = [{n:'Ⅰ',t:'1차 여행'},{n:'Ⅱ',t:'2차 여행'},{n:'Ⅲ',t:'3차 여행'},{n:'Ⅳ',t:'로마 항해'}]
    .map((m,i)=>({...m,...phaseRange(i+1)}));

  const LANDS = [
    [[26,40.5],[29,41.1],[33,42],[36,41.7],[38,41],[38,36.8],[36,36.2],[34,36.3],[30.5,36.6],[28,36.7],[26.3,38],[26.2,39.5]],
    [[19,43],[26,43],[26.5,41.2],[24,40.6],[23.8,40],[24,38.2],[23.2,36.6],[22.5,36.5],[21.5,37.8],[21,39.5],[19.5,41.5]],
    [[10,43],[13,43],[14,42],[16,41.9],[18.5,40.2],[17,39],[16.5,38.2],[15.7,38],[16,39.5],[15.5,40],[14.5,40.6],[13.2,41.3],[11.2,42.5],[10.2,43]],
    [[12.5,38],[15.6,38.2],[15.1,36.7],[13.5,37.2]],
    [[30,30.9],[31,31.5],[34,31.2],[34.7,32.2],[35.5,33.8],[35.9,35.5],[36,36.2],[38,36.8],[38,30.9]],
    [[32.3,35],[33.5,35.4],[34.5,35.6],[33.9,34.9],[32.8,34.6]],
    [[23.5,35.4],[26.2,35.2],[26,35],[24,35.1]],
    [[14.2,36.1],[14.6,36.1],[14.5,35.8],[14.2,35.85]],
  ];

  const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
  const X=lon=>(lon-10)*14.3, Y=lat=>(43-lat)*18.8;
  const pts=CITIES.map(c=>({x:X(c.lon),y:Y(c.lat)}));
  const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
  const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

  for(let i=1;i<8;i++)mk('line',{class:'grid',x1:i*50,y1:0,x2:i*50,y2:230},$('grid'));
  for(let i=1;i<5;i++)mk('line',{class:'grid',x1:0,y1:i*46,x2:400,y2:i*46},$('grid'));
  LANDS.forEach(p=>mk('polygon',{class:'land',points:p.map(q=>X(q[0])+','+Y(q[1])).join(' ')},$('lands')));

  const dim=[],done=[],dots=[],labels=[],groups=[];
  PHASES.forEach((_,pi)=>groups.push(mk('g',{class:'ph'},$('phases'))));
  CITIES.forEach((cty,i)=>{
    const g=groups[cty.ph-1], same=i<N-1&&CITIES[i+1].ph===cty.ph;
    dim[i]=same?mk('line',{class:'route-dim',x1:pts[i].x,y1:pts[i].y,x2:pts[i+1].x,y2:pts[i+1].y},g):null;
  });
  CITIES.forEach((cty,i)=>{
    const g=groups[cty.ph-1], same=i<N-1&&CITIES[i+1].ph===cty.ph;
    done[i]=same?mk('line',{class:'route-done',x1:pts[i].x,y1:pts[i].y,x2:pts[i].x,y2:pts[i].y},g):null;
  });
  CITIES.forEach((cty,i)=>{
    const g=groups[cty.ph-1];
    dots[i]=mk('circle',{class:'city-dot',cx:pts[i].x,cy:pts[i].y},g);
    labels[i]=mk('text',{class:'city-label','text-anchor':cty.a},g);labels[i].textContent=cty.ko;
  });

  // 지도 뷰(확대/이동) — 여행이 바뀔 때마다 해당 노선으로 이동
  const viewOf=p=>{const v=PHASES[p-1].view;return {z:400/(v.span*14.3),cx:X(v.lon),cy:Y(v.lat)}};
  let view=viewOf(1),curPhase=1,tweenId=0;
  function applyView(){
    const {z,cx,cy}=view;
    $('world').setAttribute('transform',`translate(200 115) scale(${z}) translate(${-cx} ${-cy})`);
    CITIES.forEach((cty,i)=>{
      if(cty.ph!==curPhase)return;
      dots[i].setAttribute('r',2.7/z);
      labels[i].setAttribute('x',pts[i].x+cty.dx/z);labels[i].setAttribute('y',pts[i].y+cty.dy/z);
      labels[i].style.fontSize=(9/z)+'px';labels[i].style.strokeWidth=(2.5/z)+'px';
    });
    $('pulse').setAttribute('r',4/z);
  }
  function setPhase(p,animate){
    const from={...view},to=viewOf(p),prev=curPhase;curPhase=p;
    groups.forEach((g,i)=>g.classList.toggle('on',i===p-1));
    const id=++tweenId;
    if(!animate||prev===p){view=to;applyView();return}
    const t0=performance.now(),D=1200;
    (function step(now){
      if(id!==tweenId)return;const k=Math.min((now-t0)/D,1),e=ease(k);
      view={z:from.z+(to.z-from.z)*e,cx:from.cx+(to.cx-from.cx)*e,cy:from.cy+(to.cy-from.cy)*e};applyView();
      if(k<1)requestAnimationFrame(step)})(t0);
  }

  const medalEls=MEDALS.map(m=>{
    const d=document.createElement('div');d.className='medal';
    d.innerHTML=`<b>${m.n}</b><span>${m.t}</span><i></i>`;$('quest').appendChild(d);return d;
  });

  let running=false,elapsed=0,startAt=0,raf=0,laps=[],lastLap=0,lastCity=-1,finished=false,sessionBase=0;
  let stats=store.get('paul-stats',{completions:0,totalMs:0});
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
  const p2=n=>String(n).padStart(2,'0');
  function fmt(ms){const t=Math.floor(ms),h=Math.floor(t/3600000),m=Math.floor(t%3600000/60000),s=Math.floor(t%60000/1000),cs=Math.floor(t%1000/10);
    return {h,m:p2(m),s:p2(s),cs:p2(cs),str:(h?h+':':'')+`${p2(m)}:${p2(s)}.${p2(cs)}`}}
  const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch{}};

  function renderStats(){
    $('stComp').textContent=stats.completions;
    const tm=Math.floor(stats.totalMs/60000);$('stTotal').textContent=tm>=60?`${Math.floor(tm/60)}h ${p2(tm%60)}m`:`${p2(tm)}m`;
    $('stN').textContent=N;
  }

  function render(){
    const f=fmt(elapsed);
    $('hh').textContent=f.h?f.h+':':'';$('mm').textContent=f.m;$('ss').textContent=f.s;$('cs').textContent='.'+f.cs;
    const seg=Math.floor(elapsed/STEP_MS),within=(elapsed%STEP_MS)/STEP_MS;
    let cur,px,py;
    if(seg>=N-1){cur=N-1;px=pts[cur].x;py=pts[cur].y;done.forEach((l,i)=>{if(l){l.setAttribute('x2',pts[i+1].x);l.setAttribute('y2',pts[i+1].y)}})}
    else{
      const k=Math.min(within/TRAVEL,1),e=ease(k),cross=CITIES[seg].ph!==CITIES[seg+1].ph;
      cur=k>=1?seg+1:seg;
      if(cross){const t=cur===seg?seg:seg+1;px=pts[t].x;py=pts[t].y}
      else{px=pts[seg].x+(pts[seg+1].x-pts[seg].x)*e;py=pts[seg].y+(pts[seg+1].y-pts[seg].y)*e}
      done.forEach((l,i)=>{if(!l)return;const r=i<seg?1:i===seg?e:0;
        l.setAttribute('x2',pts[i].x+(pts[i+1].x-pts[i].x)*r);l.setAttribute('y2',pts[i].y+(pts[i+1].y-pts[i].y)*r)});
    }
    const ph=CITIES[cur].ph;if(ph!==curPhase)setPhase(ph,running);
    $('paul').setAttribute('transform',`translate(${px} ${py}) scale(${1/view.z})`);
    dots.forEach((d,i)=>d.setAttribute('class','city-dot'+(i===cur?' current':i<cur?' visited':'')));
    labels.forEach((l,i)=>l.setAttribute('class','city-label'+(i===cur?' current':i<cur?' visited':'')));
    $('stCity').textContent=cur+1;
    medalEls.forEach((el,i)=>{const m=MEDALS[i];const prog=Math.max(0,Math.min(1,(cur-m.from+1)/(m.to-m.from+1)));
      el.style.setProperty('--p',prog*100+'%');
      const was=el.classList.contains('done'),is=cur>=m.to;
      el.classList.toggle('done',is);if(is&&!was&&running){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}});
    if(cur!==lastCity){const first=lastCity===-1;lastCity=cur;arrive(cur,!first)}
    const n=$('note');
    if(cur>=N-1)n.textContent='여정 완료 · 땅 끝 로마에 이르렀습니다';
    else if(running){const left=Math.max(0,((cur+TRAVEL)*STEP_MS-elapsed)/1000),nx=CITIES[cur+1];
      n.textContent=`다음 ${nx.ph!==CITIES[cur].ph?PHASES[nx.ph-1].name+' · ':''}${nx.ko}까지 ${left<60?left.toFixed(1)+'s':Math.floor(left/60)+'m '+p2(Math.floor(left%60))+'s'}`}
    else if(elapsed>0)n.textContent=`일시정지 · ${CITIES[cur].ko}에서 멈춤`;
    else n.textContent='START를 눌러 여정을 시작하세요';
    if(cur>=N-1&&!finished&&running)complete();
  }

  function arrive(i,announce){
    const cty=CITIES[i],startOfPhase=i===0||CITIES[i-1].ph!==cty.ph;
    $('cityName').textContent=cty.ko;$('cityEn').textContent=cty.en.toUpperCase();$('badge').textContent=PHASES[cty.ph-1].t;
    const cn=$('cityName');cn.classList.remove('flash');void cn.offsetWidth;cn.classList.add('flash');
    const p=$('pulse');p.setAttribute('cx',pts[i].x);p.setAttribute('cy',pts[i].y);p.classList.remove('go');void p.getBoundingClientRect();p.classList.add('go');
    if(announce){const t=$('toast');
      t.textContent=startOfPhase?`${PHASES[cty.ph-1].name} 시작 — ${cty.ko}`:`${cty.ko} 도착 — ${cty.note.split('·')[0].trim()}`;
      t.classList.remove('show');void t.offsetWidth;t.classList.add('show');buzz(startOfPhase?[40,40,40]:40)}
  }

  function complete(){
    finished=true;stats.completions++;store.set('paul-stats',stats);renderStats();buzz([80,60,80,60,200]);
    const cols=['#ffd56e','#d9ad4e','#f1e4bd','#d6dbe3','#ff5a47'];
    for(let i=0;i<36;i++){const c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=2.2+Math.random()*2+'s';c.style.animationDelay=Math.random()*.6+'s';
      document.body.appendChild(c);setTimeout(()=>c.remove(),5500)}
  }

  function commit(){stats.totalMs+=elapsed-sessionBase;sessionBase=elapsed;store.set('paul-stats',stats);renderStats()}
  let wake=null;
  async function lock(on){try{if(on&&'wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null}}catch{}}

  function tick(){elapsed=performance.now()-startAt;render();raf=requestAnimationFrame(tick)}
  function toggle(){
    if(running){running=false;cancelAnimationFrame(raf);commit();lock(false);
      $('startBtn').textContent='START';$('startBtn').classList.remove('running');$('lapBtn').disabled=true;$('resetBtn').disabled=false;$('time').classList.add('paused');render();buzz(30)}
    else{running=true;startAt=performance.now()-elapsed;sessionBase=elapsed;raf=requestAnimationFrame(tick);lock(true);
      $('startBtn').textContent='STOP';$('startBtn').classList.add('running');$('lapBtn').disabled=false;$('resetBtn').disabled=true;$('time').classList.remove('paused');
      document.querySelectorAll('.chip').forEach(c=>c.disabled=true);buzz(30)}
  }
  function reset(){
    if(running)return;elapsed=0;lastLap=0;laps=[];lastCity=-1;finished=false;sessionBase=0;
    done.forEach((l,i)=>{if(l){l.setAttribute('x2',pts[i].x);l.setAttribute('y2',pts[i].y)}});
    $('time').classList.remove('paused');medalEls.forEach(m=>m.classList.remove('done','pop'));
    setPhase(1,false);render();$('resetBtn').disabled=true;document.querySelectorAll('.chip').forEach(c=>c.disabled=false);
    $('laps').innerHTML='';$('laps').appendChild($('lapsEmpty'));buzz(20)
  }
  function lap(){
    if(!running)return;
    const seg=Math.floor(elapsed/STEP_MS),cur=Math.min(seg+((elapsed%STEP_MS)/STEP_MS>=TRAVEL?1:0),N-1);
    laps.push({split:elapsed-lastLap,total:elapsed,city:CITIES[cur].ko});lastLap=elapsed;renderLaps();buzz(25)
  }
  function renderLaps(){
    const box=$('laps');box.innerHTML='';let fast=-1,slow=-1;
    if(laps.length>1){let lo=Infinity,hi=-Infinity;laps.forEach((l,i)=>{if(l.split<lo){lo=l.split;fast=i}if(l.split>hi){hi=l.split;slow=i}})}
    for(let i=laps.length-1;i>=0;i--){const l=laps[i],r=document.createElement('div');
      r.className='lap'+(i===fast?' fastest':'')+(i===slow?' slowest':'');
      r.innerHTML=`<div class="no">${p2(i+1)}</div><div class="c">${l.city}</div><div class="s">${fmt(l.split).str}</div><div class="t">${fmt(l.total).str}</div>`;box.appendChild(r)}
  }

  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(running||elapsed>0)return;STEP_MS=+c.dataset.step*1000;
    document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render()});
  document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',e=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');d.className='ripple';
    d.style.cssText=`width:${s/3}px;height:${s/3}px;left:${e.clientX-r.left-s/6}px;top:${e.clientY-r.top-s/6}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)}));
  $('startBtn').onclick=toggle;$('resetBtn').onclick=reset;$('lapBtn').onclick=lap;
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key.toLowerCase()==='l')lap();else if(e.key.toLowerCase()==='r')reset()});
  document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')lock(true)});
  setPhase(1,false);renderStats();render();
</script>
</body>
</html>
